<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>MED平台 - 邮箱验证</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        .container {
            border: 1px solid #ddd;
            border-radius: 5px;
            padding: 20px;
            background-color: #f9f9f9;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #ddd;
        }
        .button {
            display: inline-block;
            background-color: #4285f4;
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 5px;
            margin: 20px 0;
        }
        .footer {
            margin-top: 30px;
            font-size: 12px;
            color: #777;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>MED平台 - 邮箱验证</h2>
        </div>
        
        <p>亲爱的 {{ user.username }},</p>
        
        <p>感谢您注册MED平台。请点击下面的按钮验证您的邮箱地址：</p>
        
        <div style="text-align: center;">
            <a href="{{ verify_url }}" class="button">验证邮箱</a>
        </div>
        
        <p>或者，您可以复制以下链接到浏览器地址栏：</p>
        
        <p style="word-break: break-all;">{{ verify_url }}</p>
        
        <p>此链接将在 {{ expires_hours }} 小时后过期。</p>
        
        <p>如果您没有注册MED平台，请忽略此邮件。</p>
        
        <div class="footer">
            <p>此致</p>
            <p>MED平台团队</p>
        </div>
    </div>
</body>
</html>
