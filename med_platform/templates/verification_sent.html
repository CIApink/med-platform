{% load static %}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>验证邮件已发送 - MED环境数据平台</title>
    <style>
        :root {
            --primary-blue: #C1E9D2;
            --brand-green: #4ab6a4c8;
            --accent-blue: #4ab6a4c8;
            --light-blue: #6fb8ed;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'MiSans', 'Segoe UI', 'Microsoft YaHei', sans-serif;
            font-weight: 400;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        }

        .verification-container {
            background: white;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.12);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }

        .verification-icon {
            font-size: 64px;
            margin-bottom: 20px;
            color: var(--brand-green);
        }

        .verification-title {
            font-size: 24px;
            color: #333;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .verification-description {
            color: #666;
            font-size: 16px;
            line-height: 1.5;
            margin-bottom: 30px;
        }

        .verification-email {
            background: #f8f9fa;
            padding: 10px 15px;
            border-radius: 6px;
            color: #333;
            font-weight: 500;
            margin-bottom: 30px;
        }

        .action-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: all 0.2s;
            border: none;
        }

        .btn-primary {
            background: var(--brand-green);
            color: white;
        }

        .btn-primary:hover {
            background: var(--light-blue);
        }

        .btn-secondary {
            background: #f8f9fa;
            color: #333;
            border: 1px solid #ddd;
        }

        .btn-secondary:hover {
            background: #e9ecef;
        }
    </style>
</head>
<body>
    <div class="verification-container">
        <div class="verification-icon">📧</div>
        <h1 class="verification-title">验证邮件已发送</h1>
        <p class="verification-description">
            我们已向您的邮箱发送了一封验证邮件，请检查您的收件箱并点击邮件中的验证链接完成注册。
        </p>
        <div class="verification-email">
            您的邮箱: {{ email|default:"user@example.com" }}
        </div>
        <div class="action-buttons">
            <a href="{% url 'sign_in' %}" class="btn btn-primary">返回登录</a>
            <a href="{% url 'index' %}" class="btn btn-secondary">返回首页</a>
        </div>
    </div>
</body>
</html>
